<!doctype html>
<html lang="en">
  <head>
    <title>武器</title>
    <meta charset="utf-8">

  <body>
    <!-- <model-viewer> HTML element -->
    <model-viewer src="gun-1-v1.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="poster.webp" shadow-intensity="1" auto-rotate>
      <button class="Hotspot" slot="hotspot-1" data-position="-0.2955419317230747m -0.0027442000418095858m -0.04294597276161533m" data-normal="-0.006891529293761909m -0.03221017439576596m -0.9994573585148031m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">武器</div>
      </button>
      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">
          View in your space
      </button>
      <div id="ar-prompt">
          <img src="ar_hand_prompt.png">
      </div>
    </model-viewer>  
    <script src="script.js"></script>
    <!-- Loads <model-viewer> for browsers: -->
